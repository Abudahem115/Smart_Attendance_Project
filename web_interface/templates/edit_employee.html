{% extends "base.html" %}
{% block title %}Edit Employee — Smart Attendance{% endblock %}

{% block content %}
<!-- Breadcrumb -->
<div class="page-breadcrumb">
    <a href="/"><i class="bi bi-house"></i></a>
    <span class="separator">/</span>
    <a href="/employees">Employees</a>
    <span class="separator">/</span>
    <span>Edit — {{ employee['name'] }}</span>
</div>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-pencil-square" style="color:var(--warning);"></i>
                Edit Employee Data
            </div>
            <div class="card-body p-3 p-sm-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person me-1" style="color:var(--primary);"></i>Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ employee['name'] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-hash me-1" style="color:var(--primary);"></i>Employee ID / Code</label>
                        <input type="text" name="code" class="form-control" value="{{ employee['employee_code'] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-envelope me-1" style="color:var(--primary);"></i>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ employee['email'] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-diagram-3 me-1" style="color:var(--primary);"></i>Department</label>
                        <select name="department" class="form-select">
                            {% set depts = ['General', 'Administration', 'Human Resources', 'Information Technology', 'Finance', 'Marketing', 'Sales', 'Operations', 'Engineering', 'Security', 'Maintenance'] %}
                            {% for dept in depts %}
                            <option value="{{ dept }}" {% if employee.get('department') == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between mt-4 flex-wrap gap-2">
                        <a href="/employees" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
